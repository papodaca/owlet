name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  arch:
    name: Arch (${{ matrix.arch }}/${{ matrix.backend }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        backend: [cpu, vulkan, hip]
        exclude:
          # ROCm/HIP is x86_64-only upstream.
          - arch: aarch64
            backend: hip
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        if: matrix.backend == 'hip'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build package
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            -e BACKEND \
            -v "$PWD":/workspace \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail /workspace/packaging/arch/smoke-docker-inner.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: arch-${{ matrix.arch }}-${{ matrix.backend }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian (${{ matrix.arch }}/${{ matrix.backend }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        backend: [cpu, vulkan, hip]
        exclude:
          - arch: aarch64
            backend: hip
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        if: matrix.backend == 'hip'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build package
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            -e BACKEND \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:26.04 \
            bash -euo pipefail /workspace/packaging/debian/smoke-docker-inner.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: debian-${{ matrix.arch }}-${{ matrix.backend }}
          path: packaging/debian/*.deb
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }}/${{ matrix.backend }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build AppImage
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            -e BACKEND \
            -e OWLET_DOCKER_ROOT=/workspace \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:26.04 \
            bash -euo pipefail /workspace/packaging/appimage/smoke-docker-inner.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}-${{ matrix.backend }}
          path: packaging/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [arch, debian, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{arch,debian,appimage}-*'
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Packages for this release (`x86_64` / `amd64` and `aarch64` / `arm64`):

            HIP/ROCm packages are **x86_64 / amd64 only** (no aarch64 HIP).

            ### Arch Linux (`.pkg.tar.zst`)

            | Package | Backend | Arches |
            | --- | --- | --- |
            | `owlet` | CPU | x86_64, aarch64 |
            | `owlet-vulkan` | Vulkan | x86_64, aarch64 |
            | `owlet-hip` | AMD HIP/ROCm | x86_64 |

            ### Debian / Ubuntu (`.deb`, built on Ubuntu 26.04; also for Debian sid)

            | Package | Backend | Arches |
            | --- | --- | --- |
            | `owlet` | CPU | amd64, arm64 |
            | `owlet-vulkan` | Vulkan | amd64, arm64 |
            | `owlet-hip` | AMD HIP/ROCm | amd64 |

            ### AppImage (built on Ubuntu 26.04)

            | Artifact | Backend |
            | --- | --- |
            | `Owlet-*-x86_64-cpu.AppImage` | CPU |
            | `Owlet-*-x86_64-vulkan.AppImage` | Vulkan |
            | `Owlet-*-aarch64-cpu.AppImage` | CPU |
            | `Owlet-*-aarch64-vulkan.AppImage` | Vulkan |

            AppImages require a host with **Ubuntu 26.04+ / equivalent glibc**
            (libadwaita ≥ 1.8). They will not run on older glibc (e.g. Ubuntu
            22.04 / 24.04). Vulkan AppImages need a host Vulkan ICD (Mesa /
            NVIDIA / AMD drivers are **not** bundled). There is no HIP
            AppImage — use Arch or Debian for ROCm.

            Install one Arch/Debian variant only — they conflict with each
            other. The HIP `.deb` needs AMD's ROCm apt repository for runtime
            libraries. Models are downloaded from Preferences and are not
            bundled.
